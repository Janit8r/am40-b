name: Build Alist & V2Ray (musl static)

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # ==============================================
      # 1. 编译 AlistGo/alist (musl 静态版)
      # ==============================================
      - name: Checkout Alist
        uses: actions/checkout@v4
        with:
          repository: AlistGo/alist
          path: alist

      - name: Build Alist musl
        working-directory: alist
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=amd64 \
          go build -o alist-musl -tags netgo -ldflags '-w -s'

      # ==============================================
      # 2. 编译 v2fly/v2ray-core (musl 静态版)
      # ==============================================
      - name: Checkout V2Ray
        uses: actions/checkout@v4
        with:
          repository: v2fly/v2ray-core
          path: v2ray

      - name: Build V2Ray musl
        working-directory: v2ray
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=amd64 \
          go build -o v2ray-musl -tags netgo -ldflags '-w -s' ./main

      # ==============================================
      # 3. 统一上传两个二进制文件
      # ==============================================
      - name: Upload musl binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-musl-all
          path: |
            alist/alist-musl
            v2ray/v2ray-musl
