name: Build 32bit musl (alist+v2ray)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install musl tools
        run: |
          sudo apt update
          sudo apt install -y musl-dev musl-tools gcc-multilib

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # ========== 编译 Alist (32位 musl，支持sqlite) ==========
      - name: Checkout Alist
        uses: actions/checkout@v4
        with:
          repository: AlistGo/alist
          path: alist

      - name: Build Alist 386 musl
        working-directory: alist
        run: |
          CC=musl-gcc \
          CGO_ENABLED=1 \
          GOOS=linux \
          GOARCH=386 \
          go build -o alist -tags "fts5 sqlite3" -ldflags "-w -s -linkmode external -extldflags '-static'"

      # ========== 编译 V2Ray (32位 musl) ==========
      - name: Checkout V2Ray
        uses: actions/checkout@v4
        with:
          repository: v2fly/v2ray-core
          path: v2ray

      - name: Build V2Ray 386 musl
        working-directory: v2ray
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=386 \
          go build -o v2ray -tags netgo -ldflags "-w -s" ./main

      # ========== 上传产物 ==========
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-386-musl-static
          path: |
            alist/alist
            v2ray/v2ray
