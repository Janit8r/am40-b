name: Build 32bit musl static sqlite
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Alist + V2Ray 386
        run: |
          mkdir -p out
          docker run --rm --platform=linux/386 -v $(pwd)/out:/out \
            i386/alpine:edge \
            sh -c "apk add --no-cache gcc musl-dev git go && \
            git clone --depth=1 https://github.com/AlistGo/alist /build && \
            cd /build && \
            CGO_ENABLED=1 GOOS=linux GOARCH=386 go build -o alist -tags sqlite3 -ldflags '-w -s -extldflags -static' && \
            git clone --depth=1 https://github.com/v2fly/v2ray-core /v2ray && \
            cd /v2ray && \
            CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -o v2ray -ldflags '-w -s' ./main && \
            cp /build/alist /out/ && \
            cp /v2ray/v2ray /out/"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-386-musl-static-sqlite
          path: out/*
