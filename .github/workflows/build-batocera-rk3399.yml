name: Build Linux 386 Musl Static (alist + v2ray)

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # ======================
      # 编译 Alist (32位 musl)
      # ======================
      - name: Checkout Alist
        uses: actions/checkout@v4
        with:
          repository: AlistGo/alist
          path: alist

      - name: Build Alist linux 386
        working-directory: alist
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=386 \
          go build -o alist -tags netgo -ldflags '-w -s'

      # ======================
      # 编译 V2Ray (32位 musl)
      # ======================
      - name: Checkout V2Ray
        uses: actions/checkout@v4
        with:
          repository: v2fly/v2ray-core
          path: v2ray

      - name: Build V2Ray linux 386
        working-directory: v2ray
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=386 \
          go build -o v2ray -tags netgo -ldflags '-w -s' ./main

      # ======================
      # 上传 32位 静态包
      # ======================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-386-musl-static
          path: |
            alist/alist
            v2ray/v2ray
